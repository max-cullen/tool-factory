<!doctype html>
<meta charset="utf-8">
<title>engine test harness</title>
<script type="module">
import * as E from '../engine/engine.js';

function toBase64(blob) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(String(r.result).split(',')[1]);
    r.onerror = reject;
    r.readAsDataURL(blob);
  });
}

// Fetch a fixture from this server, run the engine, return stats plus the output file.
window.run = async (url, opts) => {
  const resp = await fetch(url);
  const blob = await resp.blob();
  const file = new File([blob], url.split('/').pop(), { type: '' });
  try {
    const r = await E.processFile(file, opts);
    const { blob: out, ...meta } = r;
    return { ok: true, ...meta, name: E.suggestName(file.name, r), b64: await toBase64(out) };
  } catch (e) {
    return { ok: false, code: e.code || null, message: e.message, errName: e.name };
  }
};
window.runReuse = async (url) => {
  const blob = await (await fetch(url)).blob();
  const file = new File([blob], 'x.jpg');
  const img = await E.loadImage(file);
  const reuse = [];
  for (const kb of [100, 50, 20]) {
    const r = await E.fitImage(img, { maxKB: kb });
    reuse.push({ kb, bytes: r.bytes, limit: kb * 1000, w: r.width, h: r.height, ms: r.ms });
  }
  const ac = new AbortController();
  let abort = 'not-aborted';
  try {
    await E.fitImage(img, { maxKB: 30, signal: ac.signal, onProgress: ({ encodes }) => { if (encodes >= 1) ac.abort(); } });
  } catch (e) { abort = e.code; }
  img.dispose();
  return { reuse, abort };
};
window.harnessReady = true;
</script>
